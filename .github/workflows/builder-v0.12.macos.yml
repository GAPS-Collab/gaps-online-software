name: AulepeMcBuildBot

on:
  workflow_dispatch:
  push:
    branches:
    - AULEPE-0.12
  pull_request:
    branches: 
    - AULEPE-0.12
env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  aulepe-build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with: 
        submodules: 'true'
        show-progress: 'true'
        token: ${{ secrets.PAT_TOKEN }}
    - name: Get Version
      id: sw_version
      run: |
          # The shell automatically converts ${{ github.ref_name }} to a string.
          BRANCH_NAME="${{ github.ref_name }}"
          GOS_VERSION=$(echo "$BRANCH_NAME" | cut -d'-' -f2-)
          echo "version=$GOS_VERSION" >> $GITHUB_OUTPUT


    #- name: Set up GCC
    #  uses: egor-tensin/setup-gcc@v1
    #  with:
    #    version: 13
    #    platform: x64   

    - name: Set up rye
      uses: eifinger/setup-rye@v4
      with:
        enable-cache: true
        version: 'latest' 

    - name: Install dependencies
      run : sudo apt update && DEBIAN_FRONTEND=noninteractive sudo apt install -y doxygen graphviz lm-sensors libsqlite3-dev rsync 
    
    - name: intall rust 
      run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && export PATH=$PATH:~/.cargo/bin
    
    - name: General docs/landing page 
      run: cd ${{ github.workspace}}/doc/pelican-doc/ && rye sync && ./init-docs.sh 
    
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DBUILD_CXX_BINDINGS=ON -DBUILD_CXX_DB=ON -DBUILD_CXX_EXAMPLES=ON -DBUILD_CXX_PYBINDINGS=ON

    - name: Build CXX
      # Build your program with the given configuration
      #run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
      run: cd ${{github.workspace}}/build && make -j 4 
    
    - name: C++ Docs 
      run: cd ${{github.workspace}}/build && make doc 

    - name: Install C++ 
      run: cd ${{github.workspace}}/build && make install
    
    - name: Compile gondola-core Rust
      working-directory: gondola-core/rust/gondola-core 
      run: cargo check --all-features 

    - name: Test-gondola-core Rust 
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      #run: ctest -C ${{env.BUILD_TYPE}}
      run: cd ${{github.workspace}}/gondola-core/rust/gondola-core && cargo test --features="random,database,advanced-algorithms,tof-liftof" 
    
    - name: Test Liftof-cc 
      working-directory: ${{github.workspace}}/liftof/liftof-cc
      run: cargo test --all-features 

    - name: Test Liftof-rb
      working-directory: ${{github.workspace}}/liftof/liftof-rb 
      run: cargo test --all-features   
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      #run: ctest -C ${{env.BUILD_TYPE}}
   

    - name: Rust Docs
      run: cd ${{github.workspace}}/build 
    
    - name: Create .nojekyll
      run: touch ${{ github.workspace }}/build/doc/html/.nojekyll
      shell: bash

    - name: Create python API docs
      run: source ${{github.workspace }}/install/setup-env.sh && cd ${{ github.workspace }}/python/doc/ && ${{ github.workspace }}/python/doc/build-sphinx.sh

    - name: Consolidate docs
      run: cp -r ${{ github.workspace }}/tof/liftof/target/doc/* ${{ github.workspace }}/build/doc/apidocs-v${{ steps.sw_version.outputs.version }}/html/
      shell: bash
    
    - name: Consolidate docs for pybindings 
      run: cp -r ${{ github.workspace }}/python/pybindings/target/doc/* ${{ github.workspace }}/build/doc/apidocs-v${{ steps.sw_version.outputs.version }}/html/
      shell: bash
      
    - name: Consolidate pydocs
      run: cp -r ${{ github.workspace }}/python/doc/build/html ${{ github.workspace }}/build/doc/apidocs-v${{ steps.sw_version.outputs.version }}/html/gaps_online
      shell: bash
      
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@3.7.1
      with:
        github_token: ${{ secrets.PAT_TOKEN }}
        #branch: ${{ inputs.branch }}
        folder: ${{ github.workspace }}/build/doc/html/
        branch: gh-pages

