[package]
name = "gondola-core"
version = "0.11.0"
edition = "2024"

[lib]
# The name of the native library. This is the name which will be used in Python to import the
# library (i.e. `import string_sum`). If you change this, you must also change the name of the
# `#[pymodule]` in `src/lib.rs`.
#name = "dataclasses"
name = "gondola_core"
path = "src/lib.rs"
# FIXME - make this conditional?
crate-type = ["cdylib", "lib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bench]]
name = "bench"
harness = false
required-features = ["random"]



[[test]]
name = "test"
required-features  = ["random"]

[features]
random              = ["rand"]
database            = ["diesel"]
tofcontrol          = ["tof-control"]
advanced-algorithms = ["smoothed_z_score"]
pybindings          = ["pyo3","pyo3-log","numpy"]
experimental        = []

[dependencies.pyo3]
version  = "0.25"
features = ["extension-module", "multiple-pymethods"]
optional = true

[dependencies.pyo3-log]
version = "0.12"
optional = true

[dependencies.numpy]
version = "0.25"
optional = true

[dependencies.smoothed_z_score]
version  = "0.1"
optional = true



[dev-dependencies]
# for testing
# used for the random number generation
#rand = "0.8"
criterion = "0.4"
#tempfile  = "3.10"
quickcheck = "1"

[dependencies]
strum             = "0.27"
strum_macros      = "0.27"
num-traits        = "0.2"
statrs            = "0.18"
root-io           = "0.3"
oxyroot           = "0.1"
half              = { version = "2.6", features=["num-traits"]}
chrono            = "0.4"
regex             = "1.5"
glob              = "0.3"
log               = "0.4"
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
crc               = "3.0"
cfg-if            = "1.0"
indicatif         = "0.17" # TODO  - maybe this might go away or we introduce
colored           = "2.0"  #         a debugging feature  
crossbeam-channel = "0.5"
statistical       = "1.0"  # FIXME - replace this with our own implementation
toml              = "0.8"
ureq              = "2.12" # FIXME - make this a feature
polars            = { version = "0.50", features = ["lazy"], optional = true }
#pyo3              = { version = "0.23", features = ["extension-module"], optional = true }
# serialization library
#caraspace         = { version = "0.10", path = "../../../../caraspace", optional = true }

# for the database - in case we want to use postgres, 
# the feature needs to be added here, however, this would
# also require libpq to be installed.
diesel = { version = "2.2", features = ["sqlite", "64-column-tables"], optional=true }
# this fixes all compiling issues for the musl target with libsqlite
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

# for testing / features
rand   = { version = "0.9", optional = true}
# Takeru's tof-control
tof-control = {path = "../../../tof/extern/tof-control", optional = true, version = "0.9", features=[] }
#smoothed_z_score = {version = "0.1", optional = true}
#sqlite = {version = "0.30", optional = true}
